*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#242420;font:16px Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #635c49;outline-offset:4px}header{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid #deddd6}header button,.text{border:0;background:none;color:#59594f;padding:10px}main{max-width:850px;margin:72px auto;padding:0 28px}h1{font-size:clamp(32px,5vw,52px);font-weight:400;letter-spacing:-1.7px;line-height:1.12;margin:22px 0 36px}h2{font-weight:400;letter-spacing:-.5px;font-size:28px}small,.muted{color:#77776d;font-size:13px}.line{height:2px;background:#e5e3dc;position:fixed;top:0;left:0;right:0}.line i{height:100%;background:#34372e;display:block;transition:width .3s}.fields{display:grid;gap:24px;margin:32px 0}label{display:block;font-size:14px}input,textarea{border:0;border-bottom:1px solid #bbbcb1;background:transparent;padding:14px 0;width:100%;border-radius:0;color:inherit}textarea{resize:vertical;min-height:70px}.primary{border:1px solid #292d24;background:#292d24;color:white;padding:15px 25px}.outline{background:transparent;border:1px solid #cecec5;padding:14px 22px}.actions{display:flex;gap:12px;align-items:center;margin-top:30px;flex-wrap:wrap}.choices{display:grid;gap:10px}.choice{border:1px solid #d8d8ce;background:transparent;text-align:left;padding:18px 20px;display:flex;gap:18px;line-height:1.45;color:inherit;transition:background .15s}.choice:hover{background:#eeeee6}.choice[aria-pressed=true]{background:#e6e8de;border-color:#566049}.key{font-size:12px;color:#72746a;padding-top:3px;min-width:15px}.question{animation:in .25s ease} @keyframes in{from{opacity:0;transform:translateY(8px)}}.note{margin-top:25px}.score{font-size:76px;letter-spacing:-5px;font-weight:400;line-height:1}.summary{display:flex;align-items:center;gap:35px;padding:32px 0;border-block:1px solid #d5d6cc}.summary h2{margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 30px;margin:30px 0}.metric{padding:15px 0;border-bottom:1px solid #ddd}.metric div{display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px}.bar{height:3px;background:#e0e1d7}.bar i{display:block;height:100%;background:#777e66}ul{padding-left:20px;line-height:1.65}details{border-top:1px solid #ddd;padding:18px 0}summary{cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px;margin-top:20px}td,th{text-align:left;padding:12px 5px;border-bottom:1px solid #ddd;vertical-align:top}th{font-weight:400;color:#777}#saved{display:grid;gap:10px;margin-top:25px}.saved{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:15px 0}.pill{font-size:12px;border:1px solid #ccc;padding:5px 9px}.error{color:#97432c}@media(max-width:600px){main{margin-top:40px}header{height:65px}.grid{grid-template-columns:1fr}.summary{gap:20px}.score{font-size:62px}.choice{padding:15px}.actions button{flex-grow:1}}@media print{body{background:white;font-size:11px}header,.actions,details,.line{display:none!important}main{margin:0;max-width:none;padding:0}h1{font-size:26px;margin:15px 0}.score{font-size:50px}.summary{padding:15px 0}.grid{margin:12px 0;gap:5px 25px}.metric{padding:8px 0}h2{font-size:18px}ul{line-height:1.4}section{break-inside:avoid}}

:root{--ink:#222722;--accent:#475440;--border:#dedfd7}body{font-family:'Archivo',Arial,sans-serif;background:#f7f8f4;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}header{height:98px;padding:0 6vw;border-bottom:0;gap:24px}.logo{display:flex;align-items:center;flex-shrink:0}.logo img{width:105px;height:54px;object-fit:contain}#context{margin-right:auto;font-size:13px;color:#747a6e;border-left:1px solid #cfd4c7;padding-left:24px}header nav{display:flex;gap:12px}header button{font-size:13px}main{width:100%;max-width:900px;margin:42px auto 64px;padding:0 36px;flex:1}h1{font-size:clamp(32px,4.3vw,50px);font-weight:450;letter-spacing:-1.7px;line-height:1.13;margin:25px 0 36px;max-width:760px}small{font-size:12px;letter-spacing:.03em}.fields{max-width:620px;gap:25px}.fields label{color:#69705f;font-size:13px}input{font-size:20px;padding:15px 0;color:var(--ink)}input:focus,textarea:focus{outline:none;border-bottom-color:var(--ink);box-shadow:0 1px 0 var(--ink)}.primary{background:var(--ink);border-color:var(--ink);min-height:52px;font-size:14px}.primary:hover{background:#404b3a}.primary:disabled{opacity:.35;cursor:default}.outline{min-height:50px;font-size:14px}.text{font-size:13px}.choices{gap:9px}.choice{align-items:center;padding:17px 20px;background:#fff;border:1px solid var(--border);font-size:15px;min-height:62px;position:relative;line-height:1.5;transition:background .18s,border-color .18s,transform .18s}.choice:hover{background:#f1f4eb;border-color:#a4b196;transform:translateX(3px)}.choice[aria-pressed=true]{background:#e8eedf;border-color:#667a53}.key{display:flex;align-items:center;justify-content:center;width:25px;height:25px;border:1px solid #d6dbcd;flex-shrink:0;font-size:11px;padding:0}.choice[aria-pressed=true] .key{background:#475440;border-color:#475440;color:white}.note{font-size:12px;color:#767e6e;margin-top:27px}.note textarea{font-size:14px;color:var(--ink);min-height:48px;padding:12px 0}.actions{justify-content:flex-start;gap:14px;margin-top:27px}.actions .primary{margin-left:auto}.fields+.actions .primary{margin-left:0}.line{height:3px;z-index:20;background:#e7eadf}.line i{background:#7b8c67}footer{padding:27px 6vw;border-top:1px solid var(--border);font-size:11px;color:#858b7c;display:flex;gap:5px;align-items:center}footer a{color:#535d49;text-decoration:none}footer a:hover{text-decoration:underline}.summary{background:#edf0e7;padding:27px;border:0;gap:30px}.score{color:#475440}.metric div{font-size:13px}.bar{height:4px}details{margin-top:32px}summary{font-size:13px}.saved{align-items:center}table{line-height:1.5}@media(max-width:600px){header{height:82px;padding:0 22px;gap:13px}.logo img{width:74px;height:44px}#context{font-size:11px;padding-left:13px;max-width:120px;line-height:1.4}header nav{gap:0}header button{padding:10px 7px;font-size:11px}main{padding:0 22px;margin:26px auto 40px}h1{font-size:33px;letter-spacing:-1.1px;margin:22px 0 28px}.choice{padding:13px 14px;gap:13px;font-size:14px;min-height:64px}.choice:hover{transform:none}.actions{gap:10px}.actions button{flex-grow:0}.actions .primary{flex-grow:1;margin-left:15px}.fields+.actions .primary{flex-grow:0;margin-left:0}.summary{padding:22px 17px;gap:21px}.summary h2{font-size:20px}.score{font-size:57px}.grid{gap:0}footer{padding:23px 22px;font-size:10px}input{font-size:18px}.outline{padding:13px}.actions .text{padding:12px 7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media print{header{display:flex!important;height:65px;padding:0}header nav,#context{display:none}header img{width:90px}footer{padding:15px 0;margin-top:20px}main{margin:0;padding:0}.summary{background:#f0f1eb!important}h1{font-size:28px}body{display:block}}
</style><div class="line"><i id="progress"></i></div><header><a class="logo" href="https://www.cokeroluwafemi.com" target="_blank" rel="noopener noreferrer" aria-label="Coker Oluwafemi website"><img src="https://ik.imagekit.io/cokeroluwafemi/coker-animated.gif?updatedAt=1790804463214" alt="Coker Oluwafemi"></a><span id="context">Client qualification</span><nav><button onclick="showSaved()">Saved</button><button onclick="showMethod()">Scoring</button></nav></header><main id="app"></main><footer>Created by <a href="https://www.cokeroluwafemi.com" target="_blank" rel="noopener noreferrer">Coker Oluwafemi <span aria-hidden="true">↗</span></a></footer><script>
const groups=[['Budget',20],['Payment',25],['Availability',15],['Urgency',10],['Decisions',10],['Working relationship',10],['Respect',10]];
const q=[];function add(g,t,options,follow,gate=false){q.push({g,t,options,follow,gate})}
add(0,'How does their approved budget compare with your fee?',['The full fee is approved, with room for external costs.','They can cover the fee, but external costs need agreement.','They need a smaller scope to afford the work.','Their maximum budget is below your minimum fee.'],'Confirm a funded budget or agree a smaller paid scope.',true);
add(0,'Who has confirmed the money is available?',['The budget owner has confirmed the funds are allocated.','A reliable contact confirmed it; the budget owner has not.','They are waiting for funding, a sale, or another payment.','Nobody can confirm a budget.'],'Get written confirmation from the person who owns the budget.');
add(0,'How do they respond when you explain the fee?',['They discuss value and scope without disputing your worth.','They negotiate specific deliverables or payment milestones.','They repeatedly request discounts without reducing scope.','They dismiss your fee or expect speculative unpaid work.'],'Restate the fee and scope before investing more proposal time.');
add(1,'Will they accept your payment schedule?',['They accept a deposit and full payment before final handover.','They propose clear, workable milestones you can accept.','They want all payment after delivery or launch.','They refuse a deposit or written payment commitments.'],'Agree a signed payment schedule before reserving time.',true);
add(1,'How clear is their invoice approval process?',['The payer, invoice requirements and due dates are confirmed.','The payer is known; one administrative detail is unresolved.','Several approvals are needed and nobody owns the process.','They cannot identify who pays or when.'],'Identify the payer, invoice requirements and approval lead time.');
add(1,'What evidence do you have of their payment history?',['Your own experience or a credible reference confirms timely payment.','They explain past delays clearly and show how they resolved them.','There are repeated, unresolved delays reported with credible evidence.','They admit withholding agreed payment to force extra work.'],'Resolve payment history concerns with evidence and stronger milestones.',true);
add(1,'What conditions do they attach to paying you?',['Payment follows agreed deliverables and objective acceptance criteria.','Acceptance is defined, but one condition needs clarifying.','Payment depends on sales, fundraising or someone else paying them.','They reserve the right to withhold payment based on undefined satisfaction.'],'Remove open-ended or third-party payment dependencies.',true);
add(2,'Who will make time for the project?',['A named owner has allocated time and a reliable backup.','A named owner is available, but has no backup.','Their contact is overloaded and cannot commit time.','Nobody can take responsibility for the project.'],'Name a project owner and confirm their weekly availability.');
add(2,'Are the project inputs ready?',['The brief, content, assets and access are ready.','Missing inputs have named owners and realistic due dates.','Important inputs are missing without firm owners or dates.','They expect you to start immediately with no brief or inputs.'],'List missing inputs, owners and deadlines before kickoff.');
add(2,'Can they meet feedback deadlines?',['They commit to review windows and consolidated feedback.','They can commit after adjusting the schedule.','They expect flexibility but will not commit to review windows.','They routinely disappear or refuse any feedback deadlines.'],'Agree feedback windows and what happens if approvals are late.');
add(3,'What is driving their deadline?',['A clear business milestone with enough time for the work.','A real milestone that can work with a smaller scope.','An internal preference presented as an emergency.','An impossible date they refuse to adjust.'],'Validate the deadline and propose a realistic scope or date.');
add(3,'How do they react to realistic constraints?',['They discuss tradeoffs calmly and choose priorities.','They are anxious but accept a practical plan.','They pressure you to promise outcomes before discovery.','They demand you bypass the process or guarantee the impossible.'],'Test whether they will accept practical tradeoffs in writing.');
add(3,'Why are they choosing a new collaborator now?',['They planned the work and can explain what they need.','A previous arrangement ended; they explain it fairly.','They have cycled through providers without reflecting on their part.','They want you to rescue disputed work immediately without clarifying obligations.'],'Clarify the handover, current scope and reasons for previous breakdowns.');
add(4,'How many people can approve or veto the work?',['One named final decision maker.','Two or three, with one accountable final approver.','Four or more, with unclear authority.','The decision makers or hidden veto holders cannot be identified.'],'Map everyone who approves, influences or can veto the work.');
add(4,'How will competing feedback be resolved?',['One contact consolidates feedback and resolves conflicts.','Several people contribute, but an agreed escalation route exists.','You are expected to reconcile conflicting opinions yourself.','Anyone can reverse an approval at any stage without consequence.'],'Require consolidated feedback and a final approval process.');
add(4,'Can you reach the person who makes the final decision?',['They join discovery and will approve the brief.','Your contact has documented authority to approve for them.','Your contact relays messages but cannot commit.','They deny access and cannot confirm delegated authority.'],'Confirm direct access or written delegated approval authority.');
add(5,'How do they communicate when something is unclear?',['They ask specific questions and listen to the answers.','They need reassurance but respond constructively.','They interrupt, make assumptions or dismiss explanations.','They become hostile when asked reasonable questions.'],'Clarify communication expectations and observe their response.');
add(5,'How do they respond when you disagree?',['They consider the reasoning and discuss alternatives.','They challenge firmly while staying respectful.','They take disagreement personally or become defensive.','They retaliate, threaten or insult you.'],'Assess whether respectful disagreement is possible.',true);
add(5,'How well do your working styles fit?',['Your pace, communication style and expectations align.','There are differences, but both sides accept clear adjustments.','Repeated friction remains despite attempts to align.','You cannot agree on basic ways of working.'],'Agree communication channels, meeting rhythm and working hours.');
add(6,'How do they treat people with less authority?',['They are consistently respectful to staff, vendors and junior people.','They are brief or direct, but remain courteous.','They belittle people or speak contemptuously about them.','They humiliate, harass or discriminate against people.'],'Use specific observed conduct to assess respect.',true);
add(6,'How do they respond to a reasonable boundary?',['They respect working hours, scope and availability.','They ask for exceptions and accept a clear answer.','They repeatedly push after you have said no.','They use threats, insults or intimidation to get compliance.'],'State a clear boundary and assess whether they respect it.',true);
add(6,'How do they describe previous collaborators?',['They explain problems specifically and acknowledge shared responsibility.','They are frustrated but distinguish facts from personal attacks.','They blame every provider and use personal insults.','They threaten reputational harm or boast about punishing providers.'],'Ask for specific facts behind complaints and watch for retaliation.',true);

const clearerQuestions=[["Can they afford your fee?", ["Their budget covers your fee and any extra project costs.", "Their budget covers your fee. Extra costs still need approval.", "They can only afford a smaller version of the project.", "Their budget is below the minimum you are willing to charge."]], ["Is the project budget actually available?", ["The person in charge of the budget has confirmed the money is set aside.", "Your contact says the money is available, but the budget owner has not confirmed it.", "They need funding or another payment before they can pay you.", "They cannot confirm how much money is available."]], ["How did they react to your fee?", ["They understand the price and discuss what the work includes.", "They ask about changing the scope or splitting payments into stages.", "They keep asking for a discount without reducing the work.", "They dismiss your price or expect you to do free sample work."]], ["Will they agree to your payment terms?", ["They agree to a deposit and full payment before final delivery.", "They suggest payment stages that you are comfortable accepting.", "They want to pay everything after you deliver or launch the project.", "They refuse to pay a deposit or put payment terms in writing."]], ["Do you know how your invoice will get paid?", ["You know who pays, what the invoice needs, and when payment is due.", "You know who pays, but a few invoice details still need confirming.", "Several people must approve payment, and no one is managing it.", "They cannot tell you who will pay or when."]], ["What do you know about how they pay other people?", ["You have been paid on time before, or a trusted person confirms they pay on time.", "They explain a past delay and how they settled the payment.", "Reliable information shows they repeatedly pay late or leave invoices unpaid.", "They admit holding back agreed payment to get extra work."]], ["What must happen before they will pay you?", ["They pay when you complete the work agreed in the scope.", "The payment conditions are mostly clear, but one detail needs agreement.", "They will only pay after they make sales, raise funds, or receive money from someone else.", "They can refuse to pay if they are unhappy, without defining what counts as finished."]], ["Who will manage the project on their side?", ["One person has time for the project, with someone to cover if they are away.", "One person has time for the project, but no one can cover for them.", "The contact is too busy to commit enough time.", "Nobody is taking responsibility for managing the project."]], ["Are the things you need to start ready?", ["The brief, content, files and account access are ready.", "Some things are missing, but someone is responsible and has a deadline.", "Important things are missing, with no clear person or deadline.", "They want you to start immediately without a brief or the things you need."]], ["Will they make time to review your work?", ["They agree to give one combined set of feedback by agreed dates.", "They can meet review dates if the project schedule changes.", "They want you to be flexible, but will not agree to review dates.", "They often disappear or refuse to commit to giving feedback on time."]], ["Is their deadline realistic?", ["There is a clear reason for the date and enough time to do the work.", "The date is possible if you reduce the amount of work.", "The date seems arbitrary, but they treat it as an emergency.", "There is not enough time, and they refuse to change the date or scope."]], ["How do they respond when you explain what is possible?", ["They calmly choose what matters most and accept tradeoffs.", "They are worried, but agree to a realistic plan.", "They push you to promise results before you understand the project.", "They demand impossible results or insist you skip essential steps."]], ["Why are they looking for someone now?", ["They planned ahead and can clearly explain what they need.", "A previous arrangement ended, and they explain what happened fairly.", "They have replaced several people and blame each one for everything.", "They want an immediate rescue, but will not explain the previous dispute or handover."]], ["How many people have the final say?", ["One person makes the final decision.", "Two or three people decide, with one named person giving final approval.", "Four or more people are involved, and it is unclear who has the final say.", "They cannot tell you who can approve or reject the work."]], ["What happens if their team gives conflicting feedback?", ["One person combines the feedback and resolves disagreements.", "Several people give feedback, with an agreed person to settle disagreements.", "They expect you to work out whose feedback to follow.", "Anyone can undo an approval at any time, without changing the fee or deadline."]], ["Can you speak to the person who approves the work?", ["They join the initial discussion and approve the brief.", "Your contact has written permission to approve on their behalf.", "Your contact passes messages along but cannot approve anything.", "You cannot speak to the approver, and your contact has no confirmed authority."]], ["How do they behave when they do not understand something?", ["They ask clear questions and listen to your answers.", "They need extra explanation, but stay open and constructive.", "They interrupt or dismiss your explanations.", "They become hostile when you ask or answer reasonable questions."]], ["What happens when you disagree with them?", ["They listen to your reasons and discuss other options.", "They challenge your view, but remain respectful.", "They get defensive or treat disagreement as a personal criticism.", "They insult you, threaten you, or try to punish you for disagreeing."]], ["Does working with them feel comfortable and practical?", ["Your communication, pace and expectations work well together.", "You work differently, but can agree on adjustments that suit both of you.", "There is repeated friction even after you try to agree on how to work.", "You cannot agree on basic things like communication, availability or responsibilities."]], ["How do they treat staff, vendors and junior team members?", ["They are consistently respectful, regardless of someone’s role.", "They are direct or brief, but still polite.", "They talk down to people or make belittling comments.", "They humiliate, harass or discriminate against people."]], ["How do they react when you set a reasonable boundary?", ["They respect your working hours, scope and availability.", "They ask for an exception, but accept your answer.", "They keep pushing after you have clearly said no.", "They use insults, threats or intimidation to make you comply."]], ["How do they talk about people they have worked with before?", ["They describe specific problems and recognise their own part in what happened.", "They are frustrated, but talk about the work without attacking the person.", "They blame everyone else and use personal insults.", "They threaten to damage someone’s reputation or boast about punishing them."]]];clearerQuestions.forEach((x,i)=>{q[i].t=x[0];q[i].options=x[1]});
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={name:'',project:'',fee:'',answers:{},notes:{}},step=-1;const key='qualification-v1';let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]')}catch{};
function start(){step=-1;$('context').textContent='Client qualification';$('progress').style.width='0%';$('app').innerHTML=`<div class="question"><small></small><h1>Should you take<br>this project on?</h1><div class="fields"><label>Client<input id="name" value="${esc(state.name)}" autocomplete="organization"></label><label>Project<input id="project" value="${esc(state.project)}"></label><label>Your fee<input id="fee" value="${esc(state.fee)}" placeholder="₦"></label></div><div class="actions"><button class="primary" onclick="begin()">Begin assessment →</button></div></div>`}
function begin(){['name','project','fee'].forEach(k=>state[k]=$(k).value.trim());step=0;render()}
function render(){let x=q[step],a=state.answers[step];$('context').textContent=groups[x.g][0];$('progress').style.width=(step/q.length*100)+'%';$('app').innerHTML=`<div class="question"><small>${String(step+1).padStart(2,'0')} / ${q.length}</small><h1>${esc(x.t)}</h1><div class="choices">${[...x.options,'Not sure yet'].map((o,i)=>`<button class="choice" aria-pressed="${a===i}" onclick="choose(${i})"><span class="key">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div><label class="note">Notes<textarea id="note" oninput="state.notes[step]=this.value">${esc(state.notes[step]||'')}</textarea></label><div class="actions"><button class="text" onclick="back()">← Back</button><button class="primary" id="next" ${a===undefined?'disabled':''} onclick="next()">${step===q.length-1?'View result':'Continue →'}</button></div></div>`}
function choose(i){state.answers[step]=i;render();$('next').focus()}function next(){if(state.answers[step]===undefined)return;if(step<q.length-1){step++;render()}else result()}function back(){if(step>0){step--;render()}else start()}
function compute(){let cat=groups.map((g,i)=>{let ids=q.map((x,j)=>x.g===i?j:-1).filter(j=>j>=0),known=ids.filter(j=>state.answers[j]!==undefined&&state.answers[j]!==4);return {name:g[0],weight:g[1],score:known.length?Math.round(known.reduce((s,j)=>s+[100,70,30,0][state.answers[j]],0)/known.length):null,known:known.length,total:ids.length}});let unknown=q.map((x,i)=>i).filter(i=>state.answers[i]===4||state.answers[i]===undefined),gates=q.map((x,i)=>i).filter(i=>xGate(i));let raw=Math.round(cat.reduce((s,c)=>s+(c.score||0)*c.weight,0)/100);let low=cat.filter(c=>c.score!==null&&c.score<50);let verdict=gates.length?'Decline':unknown.length?'Clarify first':raw>=80&&!low.length?'Good fit':raw>=65&&!cat.some(c=>c.score<40)?'Proceed with conditions':raw>=45?'Change scope or resolve concerns':'Decline';return {cat,unknown,gates,raw,verdict};}
function xGate(i){return q[i].gate&&state.answers[i]===3}
function result(){step=q.length;$('context').textContent='Result';$('progress').style.width='100%';let r=compute(),risks=q.map((x,i)=>i).filter(i=>state.answers[i]===2||state.answers[i]===3),strength=r.cat.filter(c=>c.score>=80),action=r.verdict==='Decline'?'Do not commit to the project under the current conditions.':r.unknown.length?'Resolve the unanswered questions before making a commitment.':r.verdict==='Good fit'?'Proceed to a written scope, contract and agreed deposit.':'Resolve the conditions below before confirming the project.';$('app').innerHTML=`<small>${esc(state.name||'Unnamed client')} ${state.project?' / '+esc(state.project):''}</small><h1>${r.verdict}</h1><div class="summary"><div class="score">${r.raw}<span style="font-size:18px;letter-spacing:0">/100</span></div><div><h2>${r.unknown.length?'Provisional score':'Qualification score'}</h2><span class="muted">${q.length-r.unknown.length} of ${q.length} answered · ${new Date().toLocaleDateString('en-GB')}</span>${state.fee?`<p class="muted">Fee: ${esc(state.fee)}</p>`:''}</div></div><p>${action}</p><div class="grid">${r.cat.map(c=>`<div class="metric"><div><span>${c.name}</span><span>${c.score===null?'—':c.score+'%'} · ${c.weight}% weight</span></div><div class="bar"><i style="width:${c.score||0}%"></i></div></div>`).join('')}</div>${r.gates.length?`<section><h2>Deal breakers</h2><ul>${r.gates.map(i=>`<li>${esc(q[i].options[3])}</li>`).join('')}</ul></section>`:''}${risks.length?`<section><h2>Conditions to resolve</h2><ul>${risks.map(i=>`<li>${esc(q[i].follow)}</li>`).join('')}</ul></section>`:''}${r.unknown.length?`<section><h2>Still to confirm</h2><ul>${r.unknown.map(i=>`<li>${esc(q[i].t)}</li>`).join('')}</ul></section>`:''}${strength.length?`<section><h2>Strongest areas</h2><p>${strength.map(c=>c.name).join(' · ')}</p></section>`:''}<details><summary>Review every answer</summary>${q.map((x,i)=>`<div style="padding:16px 0"><small>${groups[x.g][0]}</small><p>${esc(x.t)}</p><p>${esc(x.options[state.answers[i]]||'Not sure yet')}</p>${state.notes[i]?`<p class="muted">${esc(state.notes[i])}</p>`:''}<button class="text" onclick="step=${i};render()">Edit answer</button></div>`).join('')}</details><div class="actions"><button class="primary" onclick="window.print()">Print / Save PDF</button><button class="outline" onclick="saveRecord()">Save assessment</button><button class="text" onclick="downloadHTML()">Download HTML</button><button class="text" onclick="state={name:'',project:'',fee:'',answers:{},notes:{}};start()">New assessment</button></div><p id="status" class="muted" role="status"></p>`}
function saveRecord(){let id=state.id||crypto.randomUUID();state.id=id;let item={...JSON.parse(JSON.stringify(state)),date:new Date().toISOString()};records=records.filter(x=>x.id!==id);records.unshift(item);try{localStorage.setItem(key,JSON.stringify(records));$('status').textContent='Saved in this browser.'}catch{$('status').textContent='Could not save in this browser. Download the HTML to keep this assessment.'}}
function showSaved(){$('app').innerHTML=`<h1>Saved assessments</h1><div id="saved">${records.length?records.map((r,i)=>`<div class="saved"><button class="text" onclick="loadRecord(${i})">${esc(r.name||'Unnamed client')}<br><small>${esc(r.project)} · ${new Date(r.date).toLocaleDateString('en-GB')}</small></button><button class="text" onclick="removeRecord(${i})">Delete</button></div>`).join(''):'<p class="muted">No saved assessments in this browser.</p>'}</div><div class="actions"><button class="outline" onclick="${step>=q.length?'result()':step>=0?'render()':'start()'}">Back</button></div>`}
function loadRecord(i){state=JSON.parse(JSON.stringify(records[i]));result()}function removeRecord(i){if(!confirm('Delete this saved assessment?'))return;records.splice(i,1);try{localStorage.setItem(key,JSON.stringify(records))}catch{}showSaved()}
function showMethod(){$('app').innerHTML=`<h1>How scoring works</h1><p>Rate observed behaviour and confirmed commitments. Urgency alone is not a problem; refusing realistic tradeoffs is.</p><table><tr><th>Area</th><th>Weight</th></tr>${groups.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}%</td></tr>`).join('')}</table><p>Answers score 100, 70, 30 or 0 from strongest to weakest. Each area is averaged, then weighted. Unknown answers do not count as evidence; any unknown makes the verdict “Clarify first” unless a deal breaker is present. The provisional total gives unassessed areas zero credit.</p><table><tr><td>Good fit</td><td>80–100; every area at least 50</td></tr><tr><td>Proceed with conditions</td><td>65–100; every area at least 40, and not already qualified</td></tr><tr><td>Change scope or resolve concerns</td><td>45–100; below the qualification requirements</td></tr><tr><td>Decline</td><td>Below 45, or a deal breaker</td></tr></table><h2>Deal breakers</h2><p>A budget below your minimum, refusal of written payment commitments, deliberate payment withholding, undefined payment discretion, retaliation, harassment, intimidation or threats overrides the score when the most severe answer is selected.</p><p>These are editable decision rules, not a prediction of payment or a validated psychological assessment. Chemistry is judged through working behaviour.</p><div class="actions"><button class="outline" onclick="${step>=q.length?'result()':step>=0?'render()':'start()'}">Back</button></div>`}
function downloadHTML(){let source='<!doctype html>\n'+document.documentElement.outerHTML;let pos=source.lastIndexOf('/*INITIAL_STATE*/');source=source.slice(0,pos)+'/*INITIAL_STATE*/state='+JSON.stringify(state).replace(/</g,'\\u003c')+';'+source.slice(pos+17);let blob=new Blob([source],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='client-qualification.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(step>=0&&step<q.length){if(/^[1-5]$/.test(e.key)){e.preventDefault();choose(Number(e.key)-1)}if(e.key==='Enter'){e.preventDefault();next()}}});/*INITIAL_STATE*/start();if(Object.keys(state.answers).length)result();
</script></html>
