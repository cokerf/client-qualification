</style></head><body><div class="line"><i id="progress"></i></div><header><a class="logo" href="https://www.cokeroluwafemi.com" target="_blank" rel="noopener noreferrer" aria-label="Coker Oluwafemi website"><img src="https://ik.imagekit.io/cokeroluwafemi/coker-animated.gif?updatedAt=1790804463214" alt="Coker Oluwafemi"></a><span id="context">Client qualification</span><nav><a href="./info.html">Info</a><button onclick="showSaved()">Saved</button><button onclick="showMethod()">Scoring</button></nav></header><main id="app"><div class="question home-content"><h1>Should you take<br>this project on?</h1><p class="intro">A practical rubric for assessing a client’s budget, payment habits and working style before you commit.</p><div class="fields"><label>Client<input id="name" value="" autocomplete="organization"></label><label>Project<input id="project" value=""></label><label>Your fee<input id="fee" value="" placeholder="₦"></label></div><div class="actions"><button class="primary" onclick="begin()">Begin assessment →</button></div></div><noscript><p>Enable JavaScript to complete the assessment. <a href="./info.html">Read about the rubric</a>.</p></noscript></main><script>
const groups=[['Budget',20],['Payment',25],['Availability',15],['Urgency',10],['Decisions',10],['Working relationship',10],['Respect',10]];
const q=[];function add(g,t,options,follow,gate=false){q.push({g,t,options,follow,gate})}
add(0,'How does their approved budget compare with your fee?',['The full fee is approved, with room for external costs.','They can cover the fee, but external costs need agreement.','They need a smaller scope to afford the work.','Their maximum budget is below your minimum fee.'],'Confirm a funded budget or agree a smaller paid scope.',true);
add(0,'Who has confirmed the money is available?',['The budget owner has confirmed the funds are allocated.','A reliable contact confirmed it; the budget owner has not.','They are waiting for funding, a sale, or another payment.','Nobody can confirm a budget.'],'Get written confirmation from the person who owns the budget.');
add(0,'How do they respond when you explain the fee?',['They discuss value and scope without disputing your worth.','They negotiate specific deliverables or payment milestones.','They repeatedly request discounts without reducing scope.','They dismiss your fee or expect speculative unpaid work.'],'Restate the fee and scope before investing more proposal time.');
add(1,'Will they accept your payment schedule?',['They accept a deposit and full payment before final handover.','They propose clear, workable milestones you can accept.','They want all payment after delivery or launch.','They refuse a deposit or written payment commitments.'],'Agree a signed payment schedule before reserving time.',true);
add(1,'How clear is their invoice approval process?',['The payer, invoice requirements and due dates are confirmed.','The payer is known; one administrative detail is unresolved.','Several approvals are needed and nobody owns the process.','They cannot identify who pays or when.'],'Identify the payer, invoice requirements and approval lead time.');
add(1,'What evidence do you have of their payment history?',['Your own experience or a credible reference confirms timely payment.','They explain past delays clearly and show how they resolved them.','There are repeated, unresolved delays reported with credible evidence.','They admit withholding agreed payment to force extra work.'],'Resolve payment history concerns with evidence and stronger milestones.',true);
add(1,'What conditions do they attach to paying you?',['Payment follows agreed deliverables and objective acceptance criteria.','Acceptance is defined, but one condition needs clarifying.','Payment depends on sales, fundraising or someone else paying them.','They reserve the right to withhold payment based on undefined satisfaction.'],'Remove open-ended or third-party payment dependencies.',true);
add(2,'Who will make time for the project?',['A named owner has allocated time and a reliable backup.','A named owner is available, but has no backup.','Their contact is overloaded and cannot commit time.','Nobody can take responsibility for the project.'],'Name a project owner and confirm their weekly availability.');
add(2,'Are the project inputs ready?',['The brief, content, assets and access are ready.','Missing inputs have named owners and realistic due dates.','Important inputs are missing without firm owners or dates.','They expect you to start immediately with no brief or inputs.'],'List missing inputs, owners and deadlines before kickoff.');
add(2,'Can they meet feedback deadlines?',['They commit to review windows and consolidated feedback.','They can commit after adjusting the schedule.','They expect flexibility but will not commit to review windows.','They routinely disappear or refuse any feedback deadlines.'],'Agree feedback windows and what happens if approvals are late.');
add(3,'What is driving their deadline?',['A clear business milestone with enough time for the work.','A real milestone that can work with a smaller scope.','An internal preference presented as an emergency.','An impossible date they refuse to adjust.'],'Validate the deadline and propose a realistic scope or date.');
add(3,'How do they react to realistic constraints?',['They discuss tradeoffs calmly and choose priorities.','They are anxious but accept a practical plan.','They pressure you to promise outcomes before discovery.','They demand you bypass the process or guarantee the impossible.'],'Test whether they will accept practical tradeoffs in writing.');
add(3,'Why are they choosing a new collaborator now?',['They planned the work and can explain what they need.','A previous arrangement ended; they explain it fairly.','They have cycled through providers without reflecting on their part.','They want you to rescue disputed work immediately without clarifying obligations.'],'Clarify the handover, current scope and reasons for previous breakdowns.');
add(4,'How many people can approve or veto the work?',['One named final decision maker.','Two or three, with one accountable final approver.','Four or more, with unclear authority.','The decision makers or hidden veto holders cannot be identified.'],'Map everyone who approves, influences or can veto the work.');
add(4,'How will competing feedback be resolved?',['One contact consolidates feedback and resolves conflicts.','Several people contribute, but an agreed escalation route exists.','You are expected to reconcile conflicting opinions yourself.','Anyone can reverse an approval at any stage without consequence.'],'Require consolidated feedback and a final approval process.');
add(4,'Can you reach the person who makes the final decision?',['They join discovery and will approve the brief.','Your contact has documented authority to approve for them.','Your contact relays messages but cannot commit.','They deny access and cannot confirm delegated authority.'],'Confirm direct access or written delegated approval authority.');
add(5,'How do they communicate when something is unclear?',['They ask specific questions and listen to the answers.','They need reassurance but respond constructively.','They interrupt, make assumptions or dismiss explanations.','They become hostile when asked reasonable questions.'],'Clarify communication expectations and observe their response.');
add(5,'How do they respond when you disagree?',['They consider the reasoning and discuss alternatives.','They challenge firmly while staying respectful.','They take disagreement personally or become defensive.','They retaliate, threaten or insult you.'],'Assess whether respectful disagreement is possible.',true);
add(5,'How well do your working styles fit?',['Your pace, communication style and expectations align.','There are differences, but both sides accept clear adjustments.','Repeated friction remains despite attempts to align.','You cannot agree on basic ways of working.'],'Agree communication channels, meeting rhythm and working hours.');
add(6,'How do they treat people with less authority?',['They are consistently respectful to staff, vendors and junior people.','They are brief or direct, but remain courteous.','They belittle people or speak contemptuously about them.','They humiliate, harass or discriminate against people.'],'Use specific observed conduct to assess respect.',true);
add(6,'How do they respond to a reasonable boundary?',['They respect working hours, scope and availability.','They ask for exceptions and accept a clear answer.','They repeatedly push after you have said no.','They use threats, insults or intimidation to get compliance.'],'State a clear boundary and assess whether they respect it.',true);
add(6,'How do they describe previous collaborators?',['They explain problems specifically and acknowledge shared responsibility.','They are frustrated but distinguish facts from personal attacks.','They blame every provider and use personal insults.','They threaten reputational harm or boast about punishing providers.'],'Ask for specific facts behind complaints and watch for retaliation.',true);

const clearerQuestions=[["Can they afford your fee?", ["Their budget covers your fee and any extra project costs.", "Their budget covers your fee. Extra costs still need approval.", "They can only afford a smaller version of the project.", "Their budget is below the minimum you are willing to charge."]], ["Is the project budget actually available?", ["The person in charge of the budget has confirmed the money is set aside.", "Your contact says the money is available, but the budget owner has not confirmed it.", "They need funding or another payment before they can pay you.", "They cannot confirm how much money is available."]], ["How did they react to your fee?", ["They understand the price and discuss what the work includes.", "They ask about changing the scope or splitting payments into stages.", "They keep asking for a discount without reducing the work.", "They dismiss your price or expect you to do free sample work."]], ["Will they agree to your payment terms?", ["They agree to a deposit and full payment before final delivery.", "They suggest payment stages that you are comfortable accepting.", "They want to pay everything after you deliver or launch the project.", "They refuse to pay a deposit or put payment terms in writing."]], ["Do you know how your invoice will get paid?", ["You know who pays, what the invoice needs, and when payment is due.", "You know who pays, but a few invoice details still need confirming.", "Several people must approve payment, and no one is managing it.", "They cannot tell you who will pay or when."]], ["What do you know about how they pay other people?", ["You have been paid on time before, or a trusted person confirms they pay on time.", "They explain a past delay and how they settled the payment.", "Reliable information shows they repeatedly pay late or leave invoices unpaid.", "They admit holding back agreed payment to get extra work."]], ["What must happen before they will pay you?", ["They pay when you complete the work agreed y explain what happened fairly.", "They have replaced several people and blame each one for everything.", "They want an immediate rescue, but will not explain the previous dispute or handover."]], ["How many people have the final say?", ["One person makes the final decision.", "Two or three people decide, with one named person giving final approval.", "Four or more people are involved, and it is unclear who has the final say.", "They cannot tell you who can approve or reject the work."]], ["What happens if their team gives conflicting feedback?", ["One person combines the feedback and resolves disagreements.", "Several people give feedback, with an agreed person to settle disagreements.", "They expect you to work out whose feedback to follow.", "Anyone can undo an approval at any time, without changing the fee or deadline."]], ["Can you speak to the person who approves the work?", ["They join the initial discussion and approve the brief.", "Your contact has written permission to approve on their behalf.", "Your contact passes messages along but cannot approve anything.", "You cannot speak to the approver, and your contact has no confirmed authority."]], ["How do they behave when they do not understand something?", ["They ask clear questions and listen to your answers.", "They need extra explanation, but stay open and constructive.", "They interrupt or dismiss your explanations.", "They become hostile when you ask or answer reasonable questions."]], ["What happens when you disagree with them?", ["They listen to your reasons and discuss other options.", "They challenge your view, but remain respectful.", "They get defensive or treat disagreement as a personal criticism.", "They insult you, threaten you, or try to punish you for disagreeing."]], ["Does working with them feel comfortable and practical?", ["Your communication, pace and expectations work well together.", "You work differently, but can agree on adjustments that suit both of you.", "There is repeated fricti ach(c=>c.classList.toggle('is-current',c.dataset.verdict===r.verdict));}

let shareConceal={client:true,project:true,fee:true,date:false,score:false,verdict:false,categories:false,findings:true};

function openShare(){if(!$('share-dialog')){const dialog=document.createElement('dialog');dialog.id='share-dialog';dialog.className='share-dialog';dialog.setAttribute('aria-labelledby','share-title');dialog.innerHTML=`<div class="share-top"><div><h2 id="share-title">Share assessment</h2><p>Choose what to conceal. Download your 4:5 poster.</p></div><button class="share-close" onclick="closeShare()" aria-label="Close share panel"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div><div class="share-layout"><div class="share-options"><fieldset><legend>Conceal from poster</legend>${concealFields.map(([key,label])=>`<label><input type="checkbox" data-conceal="${key}" ${shareConceal[key]?'checked':''} onchange="shareConceal['${key}']=this.checked;drawSharePoster()"><span>${label}</span></label>`).join('')}</fieldset><p class="share-privacy">Personal notes and individual answers are never included.</p><div class="share-buttons"><button id="poster-download" class="primary" onclick="downloadPoster()">Download PNG</button><button id="poster-native-share" class="outline" onclick="sharePoster()" hidden>Share image</button></div><p id="share-status" role="status"></p><span class="share-size">1080 × 1350 · PNG</span></div><div class="share-preview"><canvas id="share-canvas" width="1080" height="1350" role="img" aria-label="Preview of the assessment poster with concealed details omitted"></canvas></div></div>`;document.body.append(dialog);dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeShare()}});dialog.addEventListener('close',()=>{const c=$('share-canvas');c.getContext('2d').clearRect(0,0,c.width,c.height);$('share-status').textContent='';});}const d=$('share-dialog');if(!d.open)d.showModal();d.querySelectorAll('[data-conceal]').forEach(el=>el.checked=shareConceal[el.dataset.conceal]);$('poster-native-share').hidden=!(navigator.share&&navigator.canShare);drawSharePoster();if(document.fonts)document.fonts.ready.then(()=>{if(d.open)drawSharePoster()});}
function closeShare(){$('share-dialog')?.close();}
function drawSharePoster(){const canvas=$('share-canvas');if(!canvas)return;const ctx=canvas.getContext('2d'),d=posterData(),ink='#263328',muted='#64715e',palette=['#c9e6a5','#b9d8f7','#ead3f4','#ffceae','#f8e48e','#bde8db','#f0c4cc'];ctx.clearRect(0,0,1080,1350);ctx.fillStyle='#f7f8f4';ctx.fillRect(0,0,1080,1350);ctx.textBaseline='top';
function font(size,weight=450){ctx.font=weight+' '+size+'px Archivo, Arial, sans-serif';}
function text(value,x,y,size,color=ink,weight=450){font(size,weight);ctx.fillStyle=color;ctx.fillText(String(value),x,y);}
function round(x,y,w,h,r,color){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill();}
function lines(value,x,y,width,size,lineHeight,maxLines=2,color=ink,weight=450){font(size,weight);const source=String(value).replace(/\s+/g,' ').trim();if(!source)return 0;let rows=[],row='';for(const word of source.split(' ')){const candidate=row?row+' '+word:word;if(ctx.measureText(candidate).width>width&&row){rows.push(row);row=word;}else row=candidate;}if(row)rows.push(row);const overflow=rows.length>maxLines||rows.some(line=>ctx.measureText(line).width>width);if(overflow){rows=rows.slice(0,maxLines);let last=rows.at(-1);while(last&&ctx.measureText(last+'…').width>width)last=last.slice(0,-1);rows[rows.length-1]=last+'…';}rows.forEach((line,i)=>text(line,x,y+i*lineHeight,size,color,weight));return rows.length*lineHeight;}
text('PROJECT ASSESSMENT',64,61,22,muted,500);if(d.date){font(21);ctx.fillStyle=muted;const w=ctx.measureText(d.date).width;ctx.fillText(d.date,1016-w,62);}
const titleWidth=d.score===null?900:660;lines(d.verdict,64,122,titleWidth,58,65,3,ink,500);
if(d.score!==null){const x=890,y=225,r=112;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=ink;ctx.fill();ctx.lineWidth=8;ctx.strokeStyle='#46563f';ctx.beginPath();ctx.arc(x,y,r-14,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#c9e6a5';ctx.beginPath();ctx.arc(x,y,r-14,-Math.PI/2,-Math.PI/2+Math.PI*2*d.score/100);ctx.stroke();font(81,500);ctx.fillStyle='#f7f8f4';ctx.textAlign='center';ctx.fillText(String(d.score),x,y-51);text(d.provisional?'PROVISIONAL / 100':'OUT OF 100',x,y+40,15,'#c9d7bf',400);ctx.textAlign='left';}
let y=365;const fields=[['CLIENT',d.client],['PROJECT',d.project],['FEE',d.fee]].filter(f=>f[1]);if(fields.length){round(64,y,952,fields.length>2?174:112,16,'#e9eee2');fields.forEach(([label,value],i)=>{const x=88+(i%2)*464,yy=y+20+Math.floor(i/2)*72;text(label,x,yy,15,muted,500);lines(value,x,yy+24,420,25,28,1,ink,450)});y+=fields.length>2?200:138;}
if(d.categories.length){const gap=14,w=469;const cardHeight=Math.min(190,Math.floor((1242-y-42)/4)-gap);d.categories.forEach((c,i)=>{const x=64+(i%2)*(w+gap),yy=y+Math.floor(i/2)*(cardHeight+gap);round(x,yy,w,cardHeight,17,palette[i]);text(c.name,x+22,yy+19,26,ink,500);if(c.score!==null){font(44,500);ctx.fillStyle=ink;ctx.textAlign='right';ctx.fillText(c.score+'%',x+w-24,yy+53);ctx.textAlign='left';round(x+23,yy+cardHeight-22,w-46,4,2,'#26332825');round(x+23,yy+cardHeight-22,(w-46)*c.score/100,4,2,ink);}else{ctx.fillStyle='#26332812';ctx.beginPath();ctx.arc(x+w-60,yy+cardHeight-43,26,0,Math.PI*2);ctx.fill();}});const yy=y+3*(cardHeight+gap);round(547,yy,w,cardHeight,17,ink);text(d.findings?'ASSESSMENT CHECK':'ASSESSMENT SUMMARY',570,yy+20,16,'#b9cca9',500);if(d.findings){text(d.findings.known+' / '+d.findings.total+' confirmed',570,yy+50,28,'#f7f8f4',450);const summary=d.findings.gates?d.findings.gates+' deal breaker'+(d.findings.gates===1?'':'s'):d.findings.unknown?d.findings.unknown+' still to confirm':d.findings.concerns?d.findings.concerns+' concern'+(d.findings.concerns===1?'':'s')+' to review':'All questions confirmed';text(summary,570,yy+cardHeight-35,18,'#c8d7be',400);}else{[0,1,2,3,4].forEach((v,i)=>round(570+i*77,yy+cardHeight-50,65,24,5,palette[i]));}}
else{round(64,y,952,Math.max(310,1165-y),24,'#e8eddf');const colors=['#b9d8f7','#ead3f4','#c9e6a5','#ffceae'];for(let i=0;i<4;i++){ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(250+i*185,y+130+(i%2)*60,104,0,Math.PI*2);ctx.fill();}if(d.findings){text(d.findings.known+' of '+d.findings.total+' questions confirmed',100,y+310,32,ink,500);text(d.findings.gates+' deal breakers · '+d.findings.unknown+' still to confirm',100,y+365,25,muted,400);}}
ctx.fillStyle='#d9dfd2';ctx.fillRect(64,1276,952,1);text('A decision aid, based on the information available.',64,1296,18,muted,400);}
async function posterBlob(){if(document.fonts)await document.fonts.ready;drawSharePoster();return new Promise((resolve,reject)=>$('share-canvas').toBlob(blob=>blob?resolve(blob):reject(new Error('Image could not be created.')),'image/png'));}
async function downloadPoster(){const button=$('poster-download');button.disabled=true;$('share-status').textContent='';try{const blob=await posterBlob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='project-assessment.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$('share-status').textContent='PNG ready. Your concealed details are excluded.';}catch(e){$('share-status').textContent='Could not create the image. Please try again.';}finally{button.disabled=false;}}
async function sharePoster(){const button=$('poster-native-share');button.disabled=true;try{const blob=await posterBlob(),file=new File([blob],'project-assessment.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file]});$('share-status').textContent='Image shared.';}else{await downloadPoster();}}catch(e){if(e.name!=='AbortError')$('share-status').textContent='Sharing is unavailable here. Use Download PNG instead.';}finally{button.disabled=false;}}
